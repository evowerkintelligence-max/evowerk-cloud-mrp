version: 2
updates:
  # Bumps backend/pyproject.toml and backend/uv.lock together (CI runs
  # `uv lock --check`).
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]

  # Root package-lock.json covers the frontend workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: [/, /backend, /frontend]
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories: [/infra/terraform/aws, /infra/terraform/azure]
    schedule:
      interval: weekly
