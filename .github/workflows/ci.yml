name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Generate throwaway app keys
        # Fresh per run, so no key material lives in the repo.
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Lockfile matches pyproject
        # Fails when backend/pyproject.toml changed without `uv lock`.
        run: uv lock --check
      - run: uv sync --frozen
      - name: Lint (ruff, rules in root pyproject.toml)
        run: uv run --frozen ruff check .
      - name: Tests with coverage gate (lines>=70)
        # Floor sits ~2 points under current total coverage; ratchet up as it grows.
        run: uv run --frozen pytest -q --cov=app --cov-report=term --cov-fail-under=70
      - name: Coverage summary
        id: coverage
        if: ${{ !cancelled() && hashFiles('backend/.coverage') != '' }}
        run: |
          pct=$(uv run --frozen coverage report --format=total --precision=1)
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          {
            echo "### Backend coverage (pytest-cov): ${pct}% (floor 70%)"
            echo
            echo "<details><summary>Files below 100%, lowest first</summary>"
            echo
            uv run --frozen coverage report --format=markdown --skip-covered --sort=cover
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: SAST (bandit)
        run: uv run --frozen bandit -r app scripts -ll
      - name: Dependency scan (pip-audit)
        # Audits the locked runtime deps only, same scope as the image.
        run: |
          uv export --frozen --no-dev --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uv run --frozen pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          # npm workspace: one lockfile at the repo root covers frontend/.
          cache-dependency-path: package-lock.json
      - name: Install (npm ci at the workspace root)
        working-directory: .
        run: npm ci
      - name: Lint (eslint, rules in frontend/eslint.config.js)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Tests with coverage gate (lines>=95, functions>=90, branches>=88)
        # Same floors as frontend/vite.config.ts, repeated here so the gate is
        # visible in CI; raise both together.
        run: >-
          npm test -- --coverage
          --coverage.thresholds.lines=95
          --coverage.thresholds.functions=90
          --coverage.thresholds.branches=88
          --coverage.reporter=text
          --coverage.reporter=json-summary
      - name: Coverage summary
        id: coverage
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: |
          echo "pct=$(node -p 'require("./coverage/coverage-summary.json").total.lines.pct')" >> "$GITHUB_OUTPUT"
          node -e '
          const t = require("./coverage/coverage-summary.json").total;
          const rows = ["lines", "statements", "functions", "branches"]
            .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`);
          console.log(["### Frontend coverage (vitest)", "", "| Metric | Covered | Count |", "| --- | --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Build (tsc -b && vite build)
        run: npm run build
      - name: Dependency scan (npm audit)
        # --omit=dev: devDependencies (vite/esbuild's dev server, etc.) never
        # ship in the production build, so a dev-server-only advisory there
        # (e.g. GHSA-67mh-4wv8-2f99) shouldn't block CI the way a vulnerable
        # runtime dependency would.
        working-directory: .
        run: npm audit --omit=dev --audit-level=high

  # Coverage badges for the README, without a third-party service: SVGs are
  # committed to the orphan `badges` branch and served from
  # raw.githubusercontent.com. No loop: this workflow only triggers on pushes
  # to master (and on pull requests), never on pushes to `badges`.
  badges:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish coverage badges to the badges branch
        env:
          BACKEND_PCT: ${{ needs.backend.outputs.coverage }}
          FRONTEND_PCT: ${{ needs.frontend.outputs.coverage }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q badges && cd badges
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin badges; then
            git checkout -q -b badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi
          python3 - <<'EOF'
          import os

          def badge(label, pct):
              p = float(pct)
              value = f"{p:.1f}%"
              color = "#4c1" if p >= 90 else "#97ca00" if p >= 80 else "#dfb317" if p >= 70 else "#fe7d37" if p >= 60 else "#e05d44"
              lw, vw = 7 * len(label) + 10, 7 * len(value) + 10
              w = lw + vw
              return (
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="20" role="img" aria-label="{label}: {value}">'
                  f"<title>{label}: {value}</title>"
                  f'<clipPath id="r"><rect width="{w}" height="20" rx="3" fill="#fff"/></clipPath>'
                  f'<g clip-path="url(#r)"><rect width="{lw}" height="20" fill="#555"/>'
                  f'<rect x="{lw}" width="{vw}" height="20" fill="{color}"/></g>'
                  f'<g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">'
                  f'<text x="{lw / 2}" y="14">{label}</text><text x="{lw + vw / 2}" y="14">{value}</text></g></svg>\n'
              )

          for name, env in [("backend", "BACKEND_PCT"), ("frontend", "FRONTEND_PCT")]:
              if os.environ.get(env):
                  with open(f"{name}-coverage.svg", "w") as f:
                      f.write(badge(f"{name} coverage", os.environ[env]))
          EOF
          git add -A
          if git diff --cached --quiet; then
            echo "Badges unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: update coverage badges (backend ${BACKEND_PCT}%, frontend ${FRONTEND_PCT}%)"
          git push -q origin HEAD:badges

  test-container:
    # Builds Dockerfile.test and runs both suites in it, so the documented
    # one-command container run stays working.
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Both test suites in the test container
        run: docker compose -f docker-compose.test.yml run --rm --build test

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  container-scan:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t evowerk-cloud-mrp-backend:ci ./backend
      - name: Build frontend image
        # Repo root context: the npm workspace lockfile lives there.
        run: docker build -t evowerk-cloud-mrp-frontend:ci -f frontend/Dockerfile .
      - name: Build frontend production image
        run: docker build -t evowerk-cloud-mrp-frontend-prod:ci -f frontend/Dockerfile.prod .
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: evowerk-cloud-mrp-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: evowerk-cloud-mrp-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          # This is the local-dev image (frontend/Dockerfile, runs `vite dev`),
          # never deployed anywhere - see frontend/Dockerfile.prod for the real
          # deployment artifact, scanned separately below with no exclusions.
          # node_modules here is 100% the dev toolchain (vite/esbuild/typescript
          # and transitives), which never reaches a real deployment, so scanning
          # it against a production-grade bar just chases devDependency CVEs
          # (e.g. an old Go binary vendored inside esbuild) that can't affect
          # any shipped artifact. Also skipping npm's own vendored node_modules
          # (/usr/local/lib/node_modules/npm) - that's baked into every official
          # node:* image by Node itself, not something this Dockerfile controls,
          # and it's npm's internal tooling, never our app's code path.
          skip-dirs: /app/node_modules,/usr/local/lib/node_modules/npm
      - name: Scan frontend production image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: evowerk-cloud-mrp-frontend-prod:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  migration-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/evowerk_cloud_mrp  # pragma: allowlist secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: evowerk_cloud_mrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Generate throwaway app keys
        # Fresh per run, so no key material lives in the repo.
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --no-dev
      - name: Run migrations against real Postgres
        run: uv run --frozen --no-dev alembic upgrade head
      - name: Verify audit_logs is append-only
        run: uv run --frozen --no-dev python scripts/verify_audit_log_immutable.py
      - name: Verify auth_hardening downgrade handles real mfa_secret ciphertext
        run: uv run --frozen --no-dev python scripts/verify_mfa_secret_downgrade.py

  concurrency:
    # The main `backend` job runs on single-connection in-memory SQLite, which
    # can't interleave transactions - so the race guards (guarded UPDATEs,
    # non-negative guards, SAVEPOINT allocation/create retries) are only
    # exercised for real here, against a Postgres with an actual connection pool.
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CONCURRENCY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/evowerk_cloud_mrp  # pragma: allowlist secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: evowerk_cloud_mrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Generate throwaway app keys
        # Fresh per run, so no key material lives in the repo.
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Run concurrency tests against real Postgres
        run: uv run --frozen pytest tests/test_concurrency.py -q

  terraform-lint:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [aws, azure]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      # -backend=false: no real AWS/Azure credentials in CI, this only
      # catches syntax/reference errors against the real provider schema,
      # not real plan-time issues (missing permissions, invalid instance
      # types, etc.) - see infra/terraform/<cloud>/README.md.
      - run: terraform init -backend=false
      - run: terraform validate
      # No real `terraform plan`: the providers' data sources need real cloud
      # credentials, which CI deliberately doesn't hold. tests/*.tftest.hcl
      # plan against mock_provider instead and assert security invariants.
      - run: terraform test
      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.64.0
      - name: TFLint
        # Rulesets and their pinned versions live in .tflint.hcl.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --format compact
      - name: Policy-as-code (Checkov)
        # Fails on any finding not already accepted in .checkov.baseline.
        # Regenerate after deliberately accepting one:
        #   checkov -d . --framework terraform --create-baseline
        run: pipx run --spec checkov==3.3.29 checkov -d . --framework terraform --compact --quiet --baseline .checkov.baseline
      - name: IaC scan (Trivy config)
        # Accepted findings are suppressed inline with a reason
        # (`# trivy:ignore:<ID> ...`) next to the resource they apply to.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform/${{ matrix.cloud }}
          severity: HIGH,CRITICAL
          exit-code: "1"

  # Path filters only skip jobs on PRs; every push to master runs everything.
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter falls back to the GitHub API to list the PR's
    # changed files (actions/checkout's default shallow clone doesn't have
    # enough history for a local git diff) - that API call needs
    # pull-requests: read, which the default token doesn't grant without
    # this explicit permissions block.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            docker:
              - 'backend/**'
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.dockerignore'
              - 'Dockerfile.test'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infra/terraform/**'
              - '.github/workflows/ci.yml'
