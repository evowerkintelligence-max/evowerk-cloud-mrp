name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filters only skip jobs on PRs; every push to master runs everything.
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter falls back to the GitHub API to list the PR's
    # changed files (actions/checkout's default shallow clone doesn't have
    # enough history for a local git diff) - that API call needs
    # pull-requests: read, which the default token doesn't grant without
    # this explicit permissions block.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'backend/**'
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infra/terraform/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Generate throwaway app keys
        # Fresh per run, so no key material lives in the repo.
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Lockfile matches pyproject
        # Fails when backend/pyproject.toml changed without `uv lock`.
        run: uv lock --check
      - run: uv sync --frozen
      - name: Lint (ruff, rules in root pyproject.toml)
        run: uv run --frozen ruff check .
      - name: Tests
        run: uv run --frozen pytest -q --cov=app --cov-report=term --cov-fail-under=68
      - name: SAST (bandit)
        run: uv run --frozen bandit -r app scripts -ll
      - name: Dependency scan (pip-audit)
        # Audits the locked runtime deps only, same scope as the image.
        run: |
          uv export --frozen --no-dev --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uv run --frozen pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint, rules in frontend/eslint.config.js)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Tests (vitest, coverage floor in frontend/vite.config.ts)
        run: npm test -- --coverage
      - name: Build (tsc -b && vite build)
        run: npm run build
      - name: Dependency scan (npm audit)
        # --omit=dev: devDependencies (vite/esbuild's dev server, etc.) never
        # ship in the production build, so a dev-server-only advisory there
        # (e.g. GHSA-67mh-4wv8-2f99) shouldn't block CI the way a vulnerable
        # runtime dependency would.
        run: npm audit --omit=dev --audit-level=high

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  container-scan:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t evowerk-cloud-mrp-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t evowerk-cloud-mrp-frontend:ci ./frontend
      - name: Build frontend production image
        run: docker build -t evowerk-cloud-mrp-frontend-prod:ci -f frontend/Dockerfile.prod ./frontend
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: evowerk-cloud-mrp-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: evowerk-cloud-mrp-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          # This is the local-dev image (frontend/Dockerfile, runs `vite dev`),
          # never deployed anywhere - see frontend/Dockerfile.prod for the real
          # deployment artifact, scanned separately below with no exclusions.
          # node_modules here is 100% the dev toolchain (vite/esbuild/typescript
          # and transitives), which never reaches a real deployment, so scanning
          # it against a production-grade bar just chases devDependency CVEs
          # (e.g. an old Go binary vendored inside esbuild) that can't affect
          # any shipped artifact. Also skipping npm's own vendored node_modules
          # (/usr/local/lib/node_modules/npm) - that's baked into every official
          # node:* image by Node itself, not something this Dockerfile controls,
          # and it's npm's internal tooling, never our app's code path.
          skip-dirs: /app/node_modules,/usr/local/lib/node_modules/npm
      - name: Scan frontend production image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: evowerk-cloud-mrp-frontend-prod:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  migration-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/evowerk_cloud_mrp
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evowerk_cloud_mrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Generate throwaway app keys
        # Fresh per run, so no key material lives in the repo.
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --no-dev
      - name: Run migrations against real Postgres
        run: uv run --frozen --no-dev alembic upgrade head
      - name: Verify audit_logs is append-only
        run: uv run --frozen --no-dev python scripts/verify_audit_log_immutable.py
      - name: Verify auth_hardening downgrade handles real mfa_secret ciphertext
        run: uv run --frozen --no-dev python scripts/verify_mfa_secret_downgrade.py

  concurrency:
    # The main `backend` job runs on single-connection in-memory SQLite, which
    # can't interleave transactions - so the race guards (guarded UPDATEs,
    # non-negative guards, SAVEPOINT allocation/create retries) are only
    # exercised for real here, against a Postgres with an actual connection pool.
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CONCURRENCY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/evowerk_cloud_mrp
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evowerk_cloud_mrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Generate throwaway app keys
        # Fresh per run, so no key material lives in the repo.
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Run concurrency tests against real Postgres
        run: uv run --frozen pytest tests/test_concurrency.py -q

  terraform-lint:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [aws, azure]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      # -backend=false: no real AWS/Azure credentials in CI, this only
      # catches syntax/reference errors against the real provider schema,
      # not real plan-time issues (missing permissions, invalid instance
      # types, etc.) - see infra/terraform/<cloud>/README.md.
      - run: terraform init -backend=false
      - run: terraform validate
      # No real `terraform plan`: the providers' data sources need real cloud
      # credentials, which CI deliberately doesn't hold. tests/*.tftest.hcl
      # plan against mock_provider instead and assert security invariants.
      - run: terraform test
      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.64.0
      - name: TFLint
        # Rulesets and their pinned versions live in .tflint.hcl.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --format compact
      - name: Policy-as-code (Checkov)
        # Fails on any finding not already accepted in .checkov.baseline.
        # Regenerate after deliberately accepting one:
        #   checkov -d . --framework terraform --create-baseline
        run: pipx run --spec checkov==3.3.29 checkov -d . --framework terraform --compact --quiet --baseline .checkov.baseline
      - name: IaC scan (Trivy config)
        # Accepted findings are suppressed inline with a reason
        # (`# trivy:ignore:<ID> ...`) next to the resource they apply to.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform/${{ matrix.cloud }}
          severity: HIGH,CRITICAL
          exit-code: "1"
