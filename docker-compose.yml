services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (do not use the default) before deploying}
      POSTGRES_DB: evowerk_cloud_mrp
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --check=false
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  flink-jobmanager:
    build:
      context: ./backend
      dockerfile: streaming/flink.Dockerfile
    restart: unless-stopped
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    ports:
      - "8081:8081"
    depends_on:
      redpanda:
        condition: service_healthy

  flink-taskmanager:
    build:
      context: ./backend
      dockerfile: streaming/flink.Dockerfile
    restart: unless-stopped
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    depends_on:
      - flink-jobmanager

  # One-shot: the session cluster above (jobmanager+taskmanager) doesn't run
  # any job by itself - streaming/realtime_metrics_job.py (the consumer that
  # turns realtime.ticks into realtime.metrics for app.services.realtime_cache)
  # has to be submitted via the Flink CLI. Without this, every TickProducer
  # publishes into a void: Redpanda is reachable so the Kafka path is taken
  # (not TickProducer's local-fallback), but nothing ever consumes it, so
  # every stream sits at "not_running_in_this_process" forever regardless of
  # whether the connector itself works. Idempotent (skips if the job is
  # already listed) so re-running `docker compose up` doesn't submit a
  # duplicate consumer of "realtime-metrics-job" on every restart.
  flink-job-submitter:
    build:
      context: ./backend
      dockerfile: streaming/flink.Dockerfile
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        until flink list -m flink-jobmanager:8081 >/tmp/joblist 2>&1; do sleep 2; done
        grep -q 'realtime-metrics-job' /tmp/joblist || \
          flink run --python /opt/flink/usrlib/streaming/realtime_metrics_job.py \
            --jarfile /opt/flink/kafka-connector-bundle.jar -m flink-jobmanager:8081
    depends_on:
      - flink-jobmanager
      - flink-taskmanager

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (do not use the default) before deploying}@db:5432/evowerk_cloud_mrp
      REDIS_URL: redis://redis:6379/0
      REDPANDA_BROKERS: redpanda:9092
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY before deploying, e.g. python -c 'import secrets; print(secrets.token_urlsafe(48))'}"
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY before deploying, e.g. python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'}"
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      # data_dir (./data, see app/core/config.py) holds uploaded dataset
      # files - without this, `docker compose up --build`/`down` wipes them
      # even though db_data (the Postgres row describing each dataset)
      # survives, since only the container's throwaway layer held the file.
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # "localhost" (vite.config.ts's default) is this container, not the
      # backend - without this every proxied API call fails on ECONNREFUSED.
      BACKEND_HOST: backend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  backend_data:
