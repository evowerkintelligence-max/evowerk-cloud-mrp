services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evowerk_cloud_mrp
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:latest
    # Must advertise its compose-network hostname, not the default 127.0.0.1 -
    # otherwise backend/Flink resolve the bootstrap server but then get told
    # the broker lives at localhost and every metadata lookup dead-ends.
    # (Clients on the host machine need to override to localhost:9092.)
    command: redpanda start --smp 1 --memory 1G --overprovisioned --node-id 0 --check=false --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  flink-jobmanager:
    image: flink:1.19-scala_2.12
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    ports:
      - "8081:8081"
    volumes:
      - ./backend:/opt/flink/backend

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/evowerk_cloud_mrp
      REDIS_URL: redis://redis:6379/0
      REDPANDA_BROKERS: redpanda:9092
      JWT_SECRET_KEY: dev-only-secret-change-me
      # Dev-only placeholder - generate a real key before running this anywhere but
      # a laptop: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      MFA_ENCRYPTION_KEY: REPLACE_WITH_GENERATED_FERNET_KEY
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
